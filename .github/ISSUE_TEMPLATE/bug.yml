name: バグ報告
description: 再現可能な不具合を報告します
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: 何が起きたかを簡潔に記載してください。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 再現手順
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: バージョン
      description: 使用中のイメージタグまたはコミットSHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 環境
      description: OS、CPUアーキテクチャ、Docker/Composeのバージョンなど
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: ログ
      description: 秘密情報を除去して貼り付けてください。
      render: shell
