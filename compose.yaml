name: tnlastation

services:
  postgres:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: tnlastation
      POSTGRES_USER: tnlastation
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env に POSTGRES_PASSWORD を設定してください}
      TZ: Asia/Tokyo
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tnlastation -d tnlastation"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - private

  migrator:
    image: ghcr.io/miutaku/tnlastation-backend:1.1.0
    restart: "no"
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__PostgreSQL: Host=postgres;Port=5432;Database=tnlastation;Username=tnlastation;Password=${POSTGRES_PASSWORD:?.env に POSTGRES_PASSWORD を設定してください}
      TZ: Asia/Tokyo
    entrypoint: ["dotnet", "/app/migrator/TNLAStation.Migrator.dll"]
    security_opt:
      - no-new-privileges:true
    networks:
      - private

  backend:
    image: ghcr.io/miutaku/tnlastation-backend:1.1.0
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      ffmpeg-worker:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      Server__Port: 8080
      Server__ClientSocketioPort: ${TNLA_PORT:-8888}
      Api__Servers__0: http://localhost:${TNLA_PORT:-8888}
      EPGSTATION_CONFIG: /epgstation-config/config.yml
      EPGSTATION_LOG_DIR: /var/lib/tnlastation/logs
      FfmpegWorker__BaseUrl: http://ffmpeg-worker:8080
      # 低遅延ライブ (LL-HLS)。空なら選択肢に出さない。
      Streaming__LowLatencyHls__PlaylistUrlTemplate: /lowlatency/live/{streamId}/index.m3u8
      # LL-HLS の画質。添字がそのまま mode になるので、並びを変えると既存の URL の意味が変わる。
      # 1 つでも指定すると既定値は使われなくなるため、使う画質はすべて書く。
      # 1080p は 720p のおよそ 2 倍の CPU を食う。同時視聴数はそのぶん減る。
      Streaming__LiveModes__0__Name: 720p
      Streaming__LiveModes__0__Height: "720"
      Streaming__LiveModes__0__VideoBitrate: 3000k
      Streaming__LiveModes__0__AudioBitrate: 192k
      Streaming__LiveModes__1__Name: 480p
      Streaming__LiveModes__1__Height: "480"
      Streaming__LiveModes__1__VideoBitrate: 1500k
      Streaming__LiveModes__1__AudioBitrate: 128k
      Streaming__LiveModes__2__Name: 360p
      Streaming__LiveModes__2__Height: "360"
      Streaming__LiveModes__2__VideoBitrate: 700k
      Streaming__LiveModes__2__AudioBitrate: 96k
      Streaming__LiveModes__3__Name: 1080p
      Streaming__LiveModes__3__Height: "1080"
      Streaming__LiveModes__3__VideoBitrate: 6000k
      Streaming__LiveModes__3__AudioBitrate: 192k
      Recording__DropLogDirectory: /var/lib/tnlastation/drop
      Thumbnail__Directory: /var/lib/tnlastation/thumbnails
      # パスワードを含むためここだけ環境変数のまま。postgres コンテナ自身も
      # POSTGRES_PASSWORD を環境変数でしか受け取れない。
      ConnectionStrings__PostgreSQL: Host=postgres;Port=5432;Database=tnlastation;Username=tnlastation;Password=${POSTGRES_PASSWORD:?.env に POSTGRES_PASSWORD を設定してください}
      TZ: Asia/Tokyo
    extra_hosts:
      # EPG 同期と、変換無しのライブ視聴 (OpenLiveStreamAsync) はここから直接 Mirakurun を見る。
      - host.docker.internal:host-gateway
    volumes:
      # HLS のプレイリスト・セグメント・サムネイルは ffmpeg-worker が書き、backend は
      # 静的ファイルとして配るだけ。同じボリュームを両コンテナで共有する。
      - app-data:/var/lib/tnlastation
      - ${RECORDED_DIRECTORY:-recorded-data}:/recorded
      # config.yml.template も同じディレクトリに置けば、EPGStation 同様streamの省略値補完に使われる。
      - ./config:/epgstation-config:ro
      # EPGStation の %ROOT%/config/... を使うコマンドとの互換パス。
      - ./config:/config:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/api/version"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    networks:
      - private

  ffmpeg-worker:
    image: ghcr.io/miutaku/tnlastation-ffmpeg-worker:1.1.0
    restart: unless-stopped
    init: true
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      EPGSTATION_CONFIG: /epgstation-config/config.yml
      EPGSTATION_LOG_DIR: /var/lib/tnlastation/logs
      # 低遅延ライブのとき、受信した TS をここへ publish する。
      Ffmpeg__LowLatencyPublishUrlTemplate: rtsp://mediamtx:8554/live/{streamId}
      # エンコードjobはbackendからHTTP転送せず、このWorkerが共有queueから取得する。
      ConnectionStrings__PostgreSQL: Host=postgres;Port=5432;Database=tnlastation;Username=tnlastation;Password=${POSTGRES_PASSWORD:?.env に POSTGRES_PASSWORD を設定してください}
      TZ: Asia/Tokyo
    extra_hosts:
      # ライブ視聴・配信は ffmpeg-worker が自分で Mirakurun から取りに行く。
      - host.docker.internal:host-gateway
    volumes:
      - app-data:/var/lib/tnlastation
      - ${RECORDED_DIRECTORY:-recorded-data}:/recorded
      - ./config:/epgstation-config:ro
      - ./config:/config:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    networks:
      - private

  mediamtx:
    image: bluenviron/mediamtx:1.9.3
    restart: unless-stopped
    environment:
      TZ: Asia/Tokyo
    volumes:
      - ./deploy/mediamtx.yml:/mediamtx.yml:ro
    security_opt:
      - no-new-privileges:true
    networks:
      - private

  frontend:
    image: ghcr.io/miutaku/tnlastation-frontend:1.1.0
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_TNLA_API_BASE: /api
      TZ: Asia/Tokyo
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/').then(r => {
            if (!r.ok) process.exit(1)
          }).catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    networks:
      - private

  gateway:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - ${TNLA_PORT:-8888}:80
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/api/version"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - private

networks:
  private:
    driver: bridge

volumes:
  postgres-data:
  app-data:
  recorded-data:
