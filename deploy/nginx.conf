worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    # 録画やライブは長く繋ぎっぱなしになるため、既定の 60 秒では切れる。
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    client_max_body_size 0;

    # Compose がアプリコンテナを再作成すると IP が変わる。起動時に一度だけ名前解決すると
    # gateway の再起動まで 502 になるため、Docker DNS から定期的に引き直す。
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream backend {
        zone backend 64k;
        server backend:8080 resolve;
    }

    upstream frontend {
        zone frontend 64k;
        server frontend:3000 resolve;
    }

    server {
        listen 80;
        server_name _;

        proxy_http_version 1.1;
        # $host はポートを落とす。プレイリストに書く URL がポート無しになり、
        # 外から取りに行けなくなる。
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_upgrade;

        # API と配信は同一オリジンに保つ。ここが EPGStation 互換の面。
        location /api/ {
            proxy_pass http://backend;
            # 配信はバッファすると遅延が積み上がる。
            proxy_buffering off;
        }

        # Swagger UI (/api-docs) は /api/ の子パスではないため別途プロキシする。
        location /api-docs {
            proxy_pass http://backend;
        }

        location /streamfiles/ {
            proxy_pass http://backend;
            proxy_buffering off;
        }

        location /socket.io/ {
            proxy_pass http://backend;
            proxy_buffering off;
        }

        location / {
            proxy_pass http://frontend;
        }
    }
}
